services:
  api:
    platform: linux/amd64
    image: om101004/medflowai-api:v2.6
    container_name: medflowai-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - ml-service

  client:
    platform: linux/amd64
    image: om101004/medflowai-frontend:v3.0
    container_name: medflowai-client
    restart: always
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - api
      - ml-service

  ml-service:
    platform: linux/amd64
    image: om101004/medflowai-ml_service:v1.8
    container_name: medflowai-ml-service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
